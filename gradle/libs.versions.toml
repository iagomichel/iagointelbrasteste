hilt-android = { module = "com.google.dagger:hilt-android", version = "2.60.1" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version = "2.60.1" }

[plugins]
compose = { id = "org.jetbrains.kotlin.plugin.compose", version = "2.4.20" }
